name: Test free Android emulator
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check KVM
        run: |
          ls -l /dev/kvm || true
          grep -E 'vmx|svm' /proc/cpuinfo | head -1 || true
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android and verify boot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell getprop ro.build.version.release
            adb shell pm list packages | head -20
