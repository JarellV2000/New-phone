<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><title>TaskPad</title><style>*{box-sizing:border-box}body{margin:0;font:17px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#171717}main{max-width:480px;margin:auto;padding: max(32px,env(safe-area-inset-top)) 24px 32px}button,input{font:inherit;border-radius:12px;padding:14px;min-height:48px}button{border:0;background:#ececec;color:inherit;cursor:pointer}input{width:100%;border:1px solid #ccc;margin:8px 0}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:34px;letter-spacing:-1px}.task{display:flex;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #eee}.task input{width:20px;min-height:20px}.muted{color:#777;font-size:14px}.dark{background:#101010;color:white;min-height:100dvh}.dark button{background:#282020}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid button{min-height:85px;border:1px solid #503030}.red{color:#ff5656}[hidden]{display:none!important}</style><main id="pad"><header><h1>TaskPad</h1><button id="access" aria-label="Private access">•••</button></header><p class="muted">Today · My tasks</p><form id="add"><input id="task" maxlength="150" required placeholder="Add a task"><button>Add task</button></form><section id="tasks"></section></main><main id="gate" hidden><button id="back">‹ TaskPad</button><h1>Private access</h1><p>Account services are not connected in this development preview.</p><label>Username<input autocomplete="username" disabled></label><label>Password<input type="password" autocomplete="current-password" disabled></label><button disabled>Sign in</button><p class="muted">No real credentials should be entered in this preview.</p><button id="preview">Preview home screen</button></main><main id="phone" hidden><header><h1>New<span class="red">Phone</span></h1><button id="lock">Exit preview</button></header><p class="muted">Interface preview · not authenticated</p><div class="grid" id="apps"></div><p id="status" role="status"></p></main><script>const $=id=>document.getElementById(id);let tasks=[];try{tasks=JSON.parse(localStorage.getItem('taskpad.tasks')||'[]');if(!Array.isArray(tasks))tasks=[]}catch{}function save(){try{localStorage.setItem('taskpad.tasks',JSON.stringify(tasks))}catch{}render()}function render(){$('tasks').replaceChildren();tasks.forEach((t,i)=>{let row=document.createElement('label');row.className='task';let c=document.createElement('input');c.type='checkbox';c.checked=!!t.done;c.onchange=()=>{tasks[i].done=c.checked;save()};let s=document.createElement('span');s.textContent=t.text;if(t.done)s.style.textDecoration='line-through';row.append(c,s);$('tasks').append(row)})}function show(id){for(const n of ['pad','gate','phone'])$(n).hidden=n!==id;document.body.classList.toggle('dark',id==='phone')} $('add').onsubmit=e=>{e.preventDefault();let t=$('task').value.trim();if(t){tasks.push({text:t,done:false});$('task').value='';save()}};$('access').onclick=()=>show('gate');$('back').onclick=$('lock').onclick=()=>show('pad');$('preview').onclick=()=>show('phone');for(const [icon,name] of [['💬','Messages'],['👤','Contacts'],['🌐','Browser'],['🔒','Vault'],['📷','Camera'],['📝','Notes'],['📁','Files'],['⚙️','Settings']]){let b=document.createElement('button');b.textContent=icon+' '+name;b.onclick=()=>{$('status').textContent=name+' is not connected yet.'};$('apps').append(b)}render();</script></html>
